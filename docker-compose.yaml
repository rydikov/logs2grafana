services:
  alloy:
    hostname: ${ALLOY_HOSTNAME:?Set ALLOY_HOSTNAME in .env}
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    pid: host
    privileged: true
    security_opt:
      - apparmor:unconfined
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${GRAFANA_CLOUD_PROMETHEUS_USERNAME:?Set GRAFANA_CLOUD_PROMETHEUS_USERNAME in .env}
      GRAFANA_CLOUD_LOKI_USERNAME: ${GRAFANA_CLOUD_LOKI_USERNAME:?Set GRAFANA_CLOUD_LOKI_USERNAME in .env}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:?Set GRAFANA_CLOUD_API_KEY in .env}
    ports:
      - 127.0.0.1:12345:12345
    volumes:
      # systemd journal and the legacy Grafana Agent position
      - /var/log/journal:/var/log/journal:ro
      - ./tmp:/tmp

      # Alloy configuration and persistent component state
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./data:/var/lib/alloy/data

      # Host filesystems used by prometheus.exporter.unix
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /etc/localtime:/etc/localtime:ro
