integrations:
  node_exporter:
    enabled: true
    rootfs_path: /rootfs
    disable_collectors:
    - netclass
    - infiniband
    - wifi
    - arp
    - timex
    - nfs
    - mdadm
    - btrfs
    - xfs
  prometheus_remote_write:
  - basic_auth:
      password: example-grafana-token-51e7c29a804d
      username: example-grafana-user-604821
    url: https://prometheus-blocks-prod-us-central1.grafana.net/api/prom/push

loki:
  configs:
  - name: integrations
    positions:
      filename: /tmp/positions.yaml
    scrape_configs:
    - job_name: systemd_journal
      journal:
        # обычно journal лежит тут; можно опустить, если дефолт подходит
        path: /var/log/journal
        # можно задать max_age, чтобы не тащить слишком старое при первом старте
        max_age: 12h
        labels:
          job: systemd-journal
      relabel_configs:
        # unit -> label "unit"
        - source_labels: ['__journal__systemd_unit']
          target_label: 'unit'
        # hostname -> label "host"
        - source_labels: ['__journal__hostname']
          target_label: 'host'
        # syslog identifier (часто имя процесса)
        - source_labels: ['__journal_syslog_identifier']
          target_label: 'syslog_identifier'
        # priority -> level (0..7)
        - source_labels: ['__journal_priority']
          target_label: 'priority'
    clients:
    - url: https://logs-prod-us-central1.grafana.net/loki/api/v1/push
      basic_auth:
        username: example-grafana-user-604821
        password: example-grafana-token-51e7c29a804d


prometheus:
  configs:
  - name: integrations
    remote_write:
    - basic_auth:
        password: example-grafana-token-51e7c29a804d
        username: example-grafana-user-604821
      url: https://prometheus-blocks-prod-us-central1.grafana.net/api/prom/push
  global:
    scrape_interval: 15s
  wal_directory: /etc/agent/data